<html lang="ar" dir="rtl"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زاكري يا منة</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="./زاكري يا منة  0_files/css2" rel="stylesheet">
<style>
  :root{
    --bg-1:#160b2b;
    --bg-2:#301b57;
    --bg-3:#4b2a7a;
    --accent:#b98cff;
    --accent-2:#ffb4d6;
    --gold:#ffd27a;
    --rest:#7ee0c3;
    --rest-2:#4fd0e0;
    --glass:rgba(255,255,255,0.07);
    --glass-border:rgba(255,255,255,0.14);
    --text:#f6f1ff;
    --text-dim:#c9bce6;
    --shadow:0 20px 60px rgba(10,4,25,0.55);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0; padding:0; width:100%; min-height:100vh;
    background:var(--bg-1);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    overflow-x:hidden;
  }

  .scene{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
    background:
      radial-gradient(1100px 550px at 50% -10%, #5a2f8f 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, #1b0f33 100%);
    isolation:isolate;
    transition:background 0.6s ease;
  }
  .scene.rest-mode{
    background:
      radial-gradient(1100px 550px at 50% -10%, #1f6f6a 0%, transparent 60%),
      linear-gradient(180deg, #0c1f27 0%, #123a3f 55%, #0a1d24 100%);
  }

  .stars{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 20%, rgba(255,255,255,.55) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 70% 15%, rgba(255,255,255,.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 30%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 85% 40%, rgba(255,255,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 10% 55%, rgba(255,255,255,.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 60% 8%, rgba(255,255,255,.45) 50%, transparent 51%),
      radial-gradient(1px 1px at 92% 70%, rgba(255,255,255,.3) 50%, transparent 51%);
    opacity:.8;
  }

  .awning{
    position:absolute;
    top:6%; left:50%;
    transform:translateX(-50%);
    width:min(760px, 84vw);
    z-index:1;
    text-align:center;
    pointer-events:none;
  }
  .awning-bar{
    height:14px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius:10px 10px 0 0;
    box-shadow:0 6px 24px rgba(185,140,255,0.35);
    transition:background 0.6s ease;
  }
  .scene.rest-mode .awning-bar{
    background:linear-gradient(90deg, var(--rest), var(--rest-2));
    box-shadow:0 6px 24px rgba(126,224,195,0.35);
  }
  .awning-sign{
    display:inline-block;
    margin-top:10px;
    padding:8px 26px;
    background:rgba(20,10,40,0.55);
    border:1px solid var(--glass-border);
    border-radius:14px;
    backdrop-filter:blur(6px);
    font-family:'Marhey', 'Tajawal', sans-serif;
    font-size:clamp(15px, 2.6vw, 20px);
    letter-spacing:.5px;
    color:var(--accent-2);
    transition:color 0.6s ease;
  }
  .scene.rest-mode .awning-sign{ color:var(--rest); }

  .brand{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center;
    gap:10px; margin-bottom:16px; text-align:center;
  }
  .brand-title{
    font-family:'Marhey','Tajawal',sans-serif;
    font-weight:600;
    font-size:clamp(24px, 4.4vw, 34px);
    letter-spacing:.5px;
    background:linear-gradient(90deg, var(--gold), var(--accent-2), var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:0;
    transition:filter 0.6s ease;
  }
  .scene.rest-mode .brand-title{ filter:hue-rotate(140deg) saturate(1.1); }
  .brand-sub{ font-size:12px; color:var(--text-dim); letter-spacing:2px; margin-top:2px; }

  .tabs{
    position:relative; z-index:2;
    display:flex; gap:6px; margin-bottom:18px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    padding:5px; border-radius:999px;
  }
  .tab{
    border:none; background:transparent; cursor:default;
    padding:9px 22px; border-radius:999px;
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:14px;
    color:var(--text-dim); transition:all .25s ease;
  }
  .tab:disabled{ cursor:default; }
  .tab.active{
    background:linear-gradient(90deg, var(--accent), #8b5cf6);
    color:#fff;
    box-shadow:0 6px 16px rgba(139,92,246,0.4);
  }
  .scene.rest-mode .tab.active{
    background:linear-gradient(90deg, var(--rest), var(--rest-2));
    color:#04211d;
    box-shadow:0 6px 16px rgba(126,224,195,0.4);
  }

  .card{
    position:relative; z-index:2;
    width:min(560px, 94vw);
    padding:clamp(28px, 5vw, 44px) clamp(20px, 5vw, 40px);
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:28px;
    backdrop-filter:blur(14px);
    box-shadow:var(--shadow);
    text-align:center;
    overflow:hidden;
  }
  .card::before{
    content:"زاكري يا منة";
    position:absolute; inset:auto -40% -60% auto;
    font-size:170px;
    font-family:'Marhey','Tajawal',sans-serif; font-weight:600;
    color:rgba(255,255,255,0.025);
    white-space:nowrap; transform:rotate(-18deg);
    pointer-events:none; z-index:0; user-select:none;
  }
  .card > *{ position:relative; z-index:1; }

  .ring-wrap{
    position:relative;
    width:min(280px, 68vw);
    aspect-ratio:1/1;
    margin:6px auto 8px;
  }
  .ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:rgba(255,255,255,0.08); stroke-width:8; }
  .ring-fg{
    fill:none; stroke:url(#ringGrad); stroke-width:8; stroke-linecap:round;
    transition:stroke-dashoffset 0.3s linear;
  }
  .ring-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .timer{
    font-family:'Marhey','Tajawal',sans-serif; font-weight:600;
    font-variant-numeric:tabular-nums;
    font-size:clamp(38px, 9vw, 56px);
    color:#fff;
    text-shadow:0 0 30px rgba(185,140,255,0.35);
    direction:ltr;
    margin:0;
  }
  .timer-label{
    font-size:12px; color:var(--text-dim); letter-spacing:1px; margin-top:4px;
  }

  .setup{
    display:flex; align-items:stretch; justify-content:center; gap:14px;
    margin:16px 0 22px;
  }
  .setup.hidden{ display:none; }
  .setup-field{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:rgba(255,255,255,0.05);
    border:1.5px solid var(--glass-border);
    border-radius:16px;
    padding:10px 18px;
    min-width:110px;
  }
  .setup-field label{
    font-size:12px; color:var(--text-dim); letter-spacing:.5px;
  }
  .setup-field .row{
    display:flex; align-items:baseline; gap:4px;
  }
  .setup-field input[type="number"]{
    width:52px;
    background:transparent;
    border:none;
    color:#fff;
    font-family:'Marhey','Tajawal',sans-serif;
    font-weight:600;
    font-size:22px;
    text-align:center;
    direction:ltr;
    -moz-appearance:textfield;
  }
  .setup-field input[type="number"]::-webkit-outer-spin-button,
  .setup-field input[type="number"]::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .setup-field input[type="number"]:focus{ outline:none; }
  .setup-field .unit{ font-size:12px; color:var(--text-dim); }
  .setup-field:focus-within{ border-color:var(--accent-2); }
  .scene.rest-mode .setup-field:focus-within{ border-color:var(--rest); }

  .controls{
    display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
  }
  .btn{
    border:none; cursor:pointer; font-family:'Tajawal', sans-serif; font-weight:700;
    font-size:15px; border-radius:999px; padding:13px 30px;
    display:inline-flex; align-items:center; gap:8px;
    transition:transform .15s ease, box-shadow .15s ease, background .2s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn-primary{
    background:linear-gradient(90deg, var(--accent), #8b5cf6);
    color:#fff; box-shadow:0 10px 24px rgba(139,92,246,0.4);
  }
  .scene.rest-mode .btn-primary{
    background:linear-gradient(90deg, var(--rest), var(--rest-2));
    color:#04211d; box-shadow:0 10px 24px rgba(126,224,195,0.4);
  }
  .btn-primary.running{
    background:linear-gradient(90deg, #ff8a8a, #ff5c8a) !important;
    color:#fff !important;
    box-shadow:0 10px 24px rgba(255,92,138,0.4) !important;
  }
  .icon-btn{
    width:44px; height:44px; padding:0; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.06); border:1.5px solid var(--glass-border);
    color:var(--text); cursor:pointer; transition:background .2s ease, transform .15s ease;
  }
  .icon-btn:hover{ background:rgba(255,255,255,0.12); }
  .icon-btn:active{ transform:scale(0.92); }
  .icon-btn svg{ width:18px; height:18px; stroke:currentColor; fill:none; }

  .status{
    margin-top:16px; font-size:13px; color:var(--text-dim); min-height:18px;
  }
  .status b{ color:var(--accent-2); }
  .scene.rest-mode .status b{ color:var(--rest); }

  footer{
    position:relative; z-index:2; margin-top:26px; text-align:center;
    color:var(--text-dim); font-size:12.5px; letter-spacing:.5px; opacity:.75;
  }
  footer b{ color:var(--accent-2); }
  .scene.rest-mode footer b{ color:var(--rest); }

  @media (prefers-reduced-motion: reduce){
    .btn, .icon-btn, .ring-fg{ transition:none; }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="stars"></div>

  <div class="">
    <div class="awning-bar"></div>
    <div class="awning-sign" id="awningSign">☕ كافيه زاكري يا منة</div>
  </div>

  <div class="brand">
    <h1 class="brand-title">ذاكري يا منة</h1>
    <div class="brand-sub">عداد تنازلي للمذاكرة والراحة</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabFocus" disabled="">وقت المذاكرة</button>
    <button class="tab" id="tabRest" disabled="">وقت الراحة</button>
  </div>

  <div class="card">
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120">
        <defs>
          <lineargradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop id="gradStop1" offset="0%" stop-color="#ffd27a"></stop>
            <stop id="gradStop2" offset="100%" stop-color="#b98cff"></stop>
          </lineargradient>
        </defs>
        <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
        <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0.0"></circle>
      </svg>
      <div class="ring-center">
        <div class="timer" id="timer">01:00</div>
        <div class="timer-label" id="timerLabel">وقت الشغل</div>
      </div>
    </div>

    <div class="setup" id="setupWrap">
      <div class="setup-field">
        <label for="studyInput">مذاكرة</label>
        <div class="row">
          <input type="number" id="studyInput" min="1" max="180" value="25">
          <span class="unit">دقيقة</span>
        </div>
      </div>
      <div class="setup-field">
        <label for="restInput">راحة</label>
        <div class="row">
          <input type="number" id="restInput" min="1" max="180" value="5">
          <span class="unit">دقيقة</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="toggleBtn">
        <span id="toggleLabel">ابدأ</span>
      </button>
      <button class="icon-btn" id="resetBtn" title="إعادة ضبط" aria-label="إعادة ضبط">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3 4v5h5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
    </div>

    <div class="status" id="status">خلصت الراحة يا <b>منة</b>! دورة كاملة 🎉 — جاهزة لمرة تانية؟</div>
  </div>

  <footer><b> يلا ذاكري يا منة 💜
</b></footer>
</div>

<script>
(function(){
  const scene = document.getElementById('scene');
  const tabFocus = document.getElementById('tabFocus');
  const tabRest = document.getElementById('tabRest');
  const timerEl = document.getElementById('timer');
  const timerLabel = document.getElementById('timerLabel');
  const awningSign = document.getElementById('awningSign');
  const setupWrap = document.getElementById('setupWrap');
  const studyInput = document.getElementById('studyInput');
  const restInput = document.getElementById('restInput');
  const toggleBtn = document.getElementById('toggleBtn');
  const toggleLabel = document.getElementById('toggleLabel');
  const resetBtn = document.getElementById('resetBtn');
  const statusEl = document.getElementById('status');
  const ringFg = document.getElementById('ringFg');
  const gradStop1 = document.getElementById('gradStop1');
  const gradStop2 = document.getElementById('gradStop2');

  const RING_CIRC = 326.7; // 2 * PI * 52

  const durations = { focus: 25, rest: 5 }; // minutes, adjustable
  let mode = 'focus';
  let totalSeconds = durations.focus * 60;
  let remaining = totalSeconds;
  let running = false;
  let intervalId = null;
  let audioCtx = null;

  function beep(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      for(let i=0;i<3;i++){
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'sine';
        o.frequency.value = mode === 'focus' ? 880 : 660;
        const t = audioCtx.currentTime + i*0.28;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.25, t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.24);
        o.start(t); o.stop(t+0.26);
      }
    }catch(e){}
  }

  function pad(n){ return String(n).padStart(2,'0'); }

  function render(){
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    timerEl.textContent = pad(m) + ':' + pad(s);
    const offset = RING_CIRC * (1 - remaining / totalSeconds);
    ringFg.setAttribute('stroke-dashoffset', offset.toFixed(1));
  }

  function clamp(v){
    v = parseInt(v, 10);
    if(isNaN(v)) v = 1;
    return Math.min(180, Math.max(1, v));
  }

  function setMode(newMode, resetTime){
    mode = newMode;
    const isRest = mode === 'rest';
    scene.classList.toggle('rest-mode', isRest);
    tabFocus.classList.toggle('active', !isRest);
    tabRest.classList.toggle('active', isRest);
    timerLabel.textContent = isRest ? 'وقت الراحة' : 'وقت الشغل';
    awningSign.textContent = isRest ? '🌿 استراحة زاكري يا منة' : '☕ كافيه زاكري يا منة';
    gradStop1.setAttribute('stop-color', isRest ? '#7ee0c3' : '#ffd27a');
    gradStop2.setAttribute('stop-color', isRest ? '#4fd0e0' : '#b98cff');
    if(resetTime !== false){
      totalSeconds = durations[mode] * 60;
      remaining = totalSeconds;
    }
    render();
  }

  function tick(){
    remaining--;
    if(remaining <= 0){
      remaining = 0;
      render();
      finish();
      return;
    }
    render();
  }

  function start(){
    running = true;
    intervalId = setInterval(tick, 1000);
    toggleLabel.textContent = 'وقف';
    toggleBtn.classList.add('running');
    setupWrap.classList.add('hidden');
    studyInput.disabled = true; restInput.disabled = true;
    statusEl.innerHTML = mode === 'focus'
      ? 'ركّز يا <b>زاكري يا منة</b>، الوقت شغال 🔥'
      : 'ارتاح شوية يا <b>زاكري يا منة</b> 🌿';
  }

  function pause(){
    running = false;
    clearInterval(intervalId);
    toggleLabel.textContent = 'كمّل';
    toggleBtn.classList.remove('running');
    statusEl.innerHTML = 'واقف دلوقتي يا <b>زاكري يا منة</b>';
  }

  function reset(){
    running = false;
    clearInterval(intervalId);
    durations.focus = clamp(studyInput.value);
    durations.rest = clamp(restInput.value);
    setMode('focus', true);
    toggleLabel.textContent = 'ابدأ';
    toggleBtn.classList.remove('running');
    setupWrap.classList.remove('hidden');
    studyInput.disabled = false; restInput.disabled = false;
    statusEl.innerHTML = 'جهّز نفسك يا <b>زاكري يا منة</b> 💜';
  }

  function finish(){
    clearInterval(intervalId);
    beep();
    if(mode === 'focus'){
      statusEl.innerHTML = 'خلصت وقت الشغل يا <b>زاكري يا منة</b>! يلا بقى استريح 🌿';
      setMode('rest', true);
      start(); // rest starts automatically, no button press needed
    }else{
      running = false;
      toggleLabel.textContent = 'ابدأ';
      toggleBtn.classList.remove('running');
      setMode('focus', true);
      setupWrap.classList.remove('hidden');
      studyInput.disabled = false; restInput.disabled = false;
      statusEl.innerHTML = 'خلصت الراحة يا <b>زاكري يا منة</b>! دورة كاملة 🎉 — جاهز لمرة تانية؟';
    }
  }

  studyInput.addEventListener('input', function(){
    durations.focus = clamp(studyInput.value);
    if(!running && mode === 'focus'){
      totalSeconds = durations.focus * 60;
      remaining = totalSeconds;
      render();
    }
  });
  studyInput.addEventListener('blur', function(){ studyInput.value = clamp(studyInput.value); });

  restInput.addEventListener('input', function(){
    durations.rest = clamp(restInput.value);
    if(!running && mode === 'rest'){
      totalSeconds = durations.rest * 60;
      remaining = totalSeconds;
      render();
    }
  });
  restInput.addEventListener('blur', function(){ restInput.value = clamp(restInput.value); });

  toggleBtn.addEventListener('click', function(){ running ? pause() : start(); });
  resetBtn.addEventListener('click', reset);

  render();
})();
</script>



</body></html>
